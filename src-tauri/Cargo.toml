[package]
name = "easy_agent_pilot"
version = "1.5.1"
description = "Easy Agent Pilot - AI Agent 管理工具"
authors = ["you"]
edition = "2021"

[lib]
name = "easy_agent_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心
# - unstable: 实验性 API
# - protocol-asset: 允许前端通过 convertFileSrc 加载本地精灵图
# - macos-private-api: macOS 透明无边框窗口（桌面宠物悬浮窗所需）
tauri = { version = "2", features = ["unstable", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-mcp-bridge = "0.9"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# 数据库
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"

# Git 操作
git2 = { version = "0.19", features = ["vendored-openssl"] }

# Token 计数
tiktoken-rs = "0.5"

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 目录路径
dirs = "5"

# UUID
uuid = { version = "1", features = ["v4"] }

# HTTP 客户端
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
qrcode = "0.14"
axum = "0.8"
mime_guess = "2"

# 并发
parking_lot = "0.12"

# Lazy static
lazy_static = "1.4"
once_cell = "1.19"

# 系统信息
sysinfo = "0.33"

# 跨平台可执行文件查找（Windows 自动处理 PATHEXT/.cmd/.bat）
which = "7"

# Futures
futures = "0.3"

# ACP (Agent Client Protocol)
# unstable_session_usage: 读取 prompt 用量（input/output/cache tokens）
# unstable_session_model: 读取 NewSessionResponse.models 发现 Agent 支持的模型清单
agent-client-protocol = { version = "0.11", features = ["unstable_session_usage", "unstable_session_model"] }
agent-client-protocol-tokio = "0.11"

# MCP SDK (官方 Rust 实现)
rmcp = { version = "0.17", features = [
    "client",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
portable-pty = "0.9.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[dev-dependencies]
tempfile = "3"

[profile.dev]
# Keep local debugging usable, but avoid huge symbol files in repeated tauri dev rebuilds.
debug = 1

[profile.dev.package."*"]
# Dependency debug info dominates target/debug size and is rarely needed in day-to-day UI work.
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
